<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens - ReuseMais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" href="assets/faveicon-reuseMais.png" type="image/x-icon">

    <style>
        :root {
            --primary: #198754;
            --dark: #212529;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, #1a1a1a 100%);
            color: #fff;
        }

        .navbar {
            background: var(--dark) !important;
        }

        .navbar-brand {
            color: var(--primary) !important;
            font-weight: bold;
        }

        .page-content {
            padding: 100px 20px 50px;
        }

        .mensagem-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .mensagem-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .mensagem-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .mensagem-usuario {
            font-weight: bold;
            color: var(--primary);
        }

        .mensagem-data {
            font-size: 12px;
            opacity: 0.7;
        }

        .mensagem-conteudo {
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            margin: 10px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .footer {
            background: var(--dark);
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-recycle"></i> Reuse+</a>
            <div class="collapse navbar-collapse ms-auto">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <div class="container">
            <h1 class="mb-4">💬 Minhas Mensagens</h1>
            <div id="mensagensContainer">
                <div class="empty-state">
                    <i class="bi bi-chat-dots" style="font-size: 48px;"></i>
                    <p>Nenhuma mensagem ainda</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer d-flex pb-2 justify-content-center fs-5">
        <small>© <span id="getFullYear"></span> Reuse+. Todos os direitos reservados.</small>
    </footer>

    <script src="js/app.js"></script> 
    <script src="js/mensagens.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function carregarMensagens() {
            try {
                const user = JSON.parse(localStorage.getItem("user") || "{}");
                if (!user.id) { window.location.href = "login.html"; return; }

                const token = localStorage.getItem("token");
                const headers = { "Content-Type": "application/json", "Authorization": `Bearer ${token}` };

                const response = await fetch("http://localhost:5069/api/mensagens", { headers });
                const mensagens = await response.json();

                const container = document.getElementById("mensagensContainer");
                container.innerHTML = "";

                if (mensagens.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="bi bi-chat-dots" style="font-size: 48px;"></i><p>Nenhuma mensagem ainda</p></div>`;
                    return;
                }

                mensagens.forEach(msg => {
                    const data = new Date(msg.dataEnvio).toLocaleString("pt-BR");
                    const item = document.createElement("div");
                    item.className = "mensagem-item";
                    item.innerHTML = `
                        <div class="mensagem-header">
                            <span class="mensagem-usuario">📨 ${msg.deUsuarioNome}</span>
                            <span class="mensagem-data">${data}</span>
                        </div>
                        <div class="mensagem-conteudo">${msg.conteudo}</div>
                        ${msg.produtoId ? `<small>Sobre um produto</small>` : ""}
                    `;
                    container.appendChild(item);
                });
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        window.addEventListener("load", carregarMensagens);
    </script>
</body>

</html>
