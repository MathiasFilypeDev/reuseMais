<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reuse+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/faveicon-reuseMais.png" type="image/x-icon">
</head>

<body class="bg-dark text-white">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-success" href="#">Reuse+ Admin</a>
            <div class="d-flex ms-auto">
                <!-- Dropdown do usuário -->
                <div class="dropdown">
                    <button class="btn btn-outline-light dropdown-toggle" type="button" id="userMenu"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <span id="userName">Usuário</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                        <li><span class="dropdown-item-text fw-bold" id="userFullName">Usuário</span></li>
                        <li><span class="dropdown-item-text" id="userEmail"></span></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><button class="dropdown-item text-danger" id="logoutBtn">Sair</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Relatório -->
                <div class="card bg-dark text-white mb-4 shadow-lg">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Relatório</h3>
                        <div class="d-flex justify-content-center mb-3">
                            <select id="tipoRelatorio" class="form-select w-auto me-2">
                                <option value="">Todos</option>
                                <option value="entrada">Entradas</option>
                                <option value="saida">Saídas</option>
                            </select>
                            <button class="btn btn-primary"
                                onclick="consultarRelatorio(document.getElementById('tipoRelatorio').value)">Consultar</button>
                        </div>
                        <table class="table table-dark table-striped table-bordered text-center" id="tabelaRelatorio">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tipo</th>
                                    <th>ItemId</th>
                                    <th>Quantidade</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <!-- Estatísticas -->
                <div class="card bg-dark text-white mb-4 shadow-lg">
                    <div class="card-body text-center">
                        <h3 class="card-title mb-4">Estatísticas</h3>
                        <div id="estatisticas" class="mb-3"></div>
                        <button class="btn btn-info" onclick="consultarEstatisticas()">Atualizar Estatísticas</button>
                    </div>
                </div>

                <!-- Gráfico -->
                <div class="card bg-dark text-white mb-4 shadow-lg">
                    <div class="card-body text-center">
                        <h3 class="card-title mb-4">Gráfico de Movimentações</h3>
                        <canvas id="graficoMovimentacoes" width="400" height="200"></canvas>
                        <button class="btn btn-warning mt-3" onclick="consultarEstatisticas()">Atualizar
                            Gráfico</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="footer text-center mt-5 mb-3">
        <small>© <span id="currentYear"></span> Reuse+. Área Administrativa.</small>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="Js/admin.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("currentYear").textContent = new Date().getFullYear();

            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            // Exemplo simples: valores fixos até o backend enviar claims
            const userName = "Admin";
            const userEmail = "admin@reusemais.com";

            document.getElementById("userName").textContent = userName;
            document.getElementById("userFullName").textContent = userName;
            document.getElementById("userEmail").textContent = userEmail;

            // Logout
            document.getElementById("logoutBtn").addEventListener("click", () => {
                localStorage.removeItem("token");
                window.location.href = "login.html";
            });
        });
    </script>
</body>

</html>
