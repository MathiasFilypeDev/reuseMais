<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="Js/admin.js" defer></script>
</head>

<body id="bodyPrincipal" onload="verificarLogin()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Reuse+</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><button class="btn btn-outline-light" onclick="logout()">Sair</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container page-content mt-5">
        <h1 class="text-center mb-4">Painel do Administrador</h1>
        <button class="btn btn-success me-2" onclick="consultarRelatorio('entrada')">Consultar Entradas</button>
        <button class="btn btn-danger me-2" onclick="consultarRelatorio('saida')">Consultar Saídas</button>
        <button class="btn btn-info" onclick="consultarEstatisticas()">Consultar Estatísticas</button>

        <h2 class="mt-4">Relatório</h2>
        <table id="tabelaRelatorio" class="table table-dark table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Item</th>
                    <th>Quantidade</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h2 class="mt-4">Estatísticas</h2>
        <div id="estatisticas" class="mb-3"></div>
        <canvas id="graficoMovimentacoes" width="400" height="200"></canvas>
    </main>

    <footer class="footer text-center">
        © Reuse+. Todos os direitos reservados.
    </footer>
</body>

</html>
