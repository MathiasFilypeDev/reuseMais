<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="Js/admin.js" defer></script>
</head>

<body id="bodyPrincipal" onload="verificarLogin()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Reuse+</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><button class="btn btn-outline-light" onclick="logout()">Sair</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container page-content mt-5">
        <h1 class="text-center mb-4">Painel do Administrador</h1>
    
        <!-- ✅ VISUALIZAR E GERENCIAR PRODUTOS -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h2>📦 Produtos do Sistema</h2>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    Você pode visualizar todos os produtos e deletar se necessário.
                    Os usuários são os responsáveis por criar e editar seus produtos.
                </div>
    
                <table id="tabelaProdutos" class="table table-dark table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Quantidade</th>
                            <th>Criado por</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalProduto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitulo">Novo Produto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProduto">
                        <div class="mb-3">
                            <label for="nomeProduto" class="form-label">Nome:</label>
                            <input type="text" id="nomeProduto" class="form-control" required>
                        </div>
    
                        <div class="mb-3">
                            <label for="categoriaProduto" class="form-label">Categoria:</label>
                            <select id="categoriaProduto" class="form-control" required>
                                <option value="">Selecione uma categoria</option>
                                <option value="Roupas">Roupas</option>
                                <option value="Eletrônicos">Eletrônicos</option>
                                <option value="Móveis">Móveis</option>
                                <option value="Livros">Livros</option>
                                <option value="Utensílios">Utensílios</option>
                            </select>
                        </div>
    
                        <div class="mb-3">
                            <label for="quantidadeProduto" class="form-label">Quantidade:</label>
                            <input type="number" id="quantidadeProduto" class="form-control" min="0" required>
                        </div>
    
                        <div class="mb-3">
                            <label for="descricaoProduto" class="form-label">Descrição:</label>
                            <textarea id="descricaoProduto" class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="salvarProduto()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center">
        © Reuse+. Todos os direitos reservados.
    </footer>
</body>
<script src="https://cdn.jsdelivr.net/npm/chart.js">
    // Função auxiliar para fazer requisições com token
    async function fetchComToken(url, options = {}) {
        const token = localStorage.getItem("token");

        const headers = {
            "Content-Type": "application/json",
            ...options.headers
        };

        if (token) {
            headers["Authorization"] = `Bearer ${token}`;
        }

        return fetch(url, {
            ...options,
            headers
        });
    }

    // Exemplo de uso:
    async function carregarUsuarios() {
        const response = await fetchComToken("http://localhost:5069/api/users");
        const data = await response.json();
        console.log(data);
    }
</script>

</html>
