<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Painel Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-secondary ">
    <div class="container mt-4">
        <h2 class="my-4 text-center">📊 Painel de Administração</h2>

        <div class="row g-3 p-3 d-flex justify-content-evenly">
            <div class="col-md-2">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="card-title">Produtos Cadastrados</h6>
                        <h3 id="resumoProdutos" class="text-primary">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="card-title">Produtos Disponíveis</h6>
                        <h3 id="resumoDisponiveis" class="text-success">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="card-title">Saídas</h6>
                        <h3 id="resumoSaidas" class="text-danger">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="card-title">Usuários Logados</h6>
                        <h3 id="resumoUsuarios" class="text-info">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <h6 class="card-title">Usuários Cadastrados</h6>
                        <h3 id="resumoUsuariosCadastrados" class="text-warning">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2 mt-4">
            <button class="btn btn-primary mb-3" id="abrirModal">📈 Ver Estatísticas</button>
            <button class="btn btn-secondary mb-3" id="abrirModalFiltros">⚙️ Filtro Detalhado</button>
            <button class="btn btn-danger mb-3" id="btnLogout">🚪 Logout</button>
        </div>
    </div>

    <div class="modal fade" id="modalGraficos" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-dark text-light shadow-lg">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Estatísticas Detalhadas</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <h4 class="text-info">Produtos</h4>
                            <canvas id="graficoProdutos"></canvas>
                            <select id="filtroProdutos" class="form-select mt-2 bg-dark text-light border-secondary">
                                <option value="all">Todos</option>
                                <option value="1h">Última hora</option>
                                <option value="1d">Último dia</option>
                                <option value="1w">Última semana</option>
                                <option value="1m">Último mês</option>
                                <option value="6m">Últimos 6 meses</option>
                                <option value="1y">Último ano</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-4">
                            <h4 class="text-warning">Usuários</h4>
                            <canvas id="graficoUsuarios"></canvas>
                            <select id="filtroUsuarios" class="form-select mt-2 bg-dark text-light border-secondary">
                                <option value="all">Todos</option>
                                <option value="1h">Última hora</option>
                                <option value="1d">Último dia</option>
                                <option value="1w">Última semana</option>
                                <option value="1m">Último mês</option>
                                <option value="6m">Últimos 6 meses</option>
                                <option value="1y">Último ano</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button id="btnFiltrar" class="btn btn-success">Filtrar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="msgArea"></div>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
