<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="Js/login.js" defer></script>
</head>

<body id="bodyPrincipal">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Reuse+</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="cadastro.html">Cadastro</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container page-content mt-5">
        <div id="msgArea" class="mb-3"></div>
        <h1 class="text-center mb-4">Login</h1>
        <form id="formLogin" class="card p-4 mx-auto" style="max-width:400px;">
            <!-- Conteúdo principal -->
            <label class="form-label m-auto mb-3 bg-success rounded-3 p-1 fs-6">Tipo de Usuário</label>
            <div class="d-flex gap-3 m-auto">
                <div class="form-check form-check-inline">
                    <label for="rangeUsuario" class="form-label btn btn-outline-primary m-auto">Usuário</label>
                    <input type="radio" id="rangeUsuario" name="tipoUsuario" value="usuario" class="form-check-input" checked>
                </div>
                <div class="form-check form-check-inline ">
                    <label for="rangeAdmin" class="form-label btn btn-outline-primary">Admin</label>
                    <input type="radio" id="rangeAdmin" name="tipoUsuario" value="admin" class="form-check-input">
                </div>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <!-- Range para escolher tipo de usuário -->
            <div class="mb-3">
            </div>

            <button type="submit" class="btn btn-success w-100">Entrar</button>
        </form>
        <p class="text-center mt-3">Não possui conta? <a href="cadastro.html">Cadastre-se</a></p>
    </main>

    <!-- Rodapé -->
    <footer class="footer text-center">
        © Reuse+. Todos os direitos reservados.
    </footer>
</body>

</html>
