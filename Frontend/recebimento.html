<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Registrar Movimentação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="Js/recebimento.js" defer></script>
</head>

<body id="bodyPrincipal" onload="verificarLogin()">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Reuse+</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="btn btn-outline-light" onclick="logout()">Sair</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container page-content mt-5">
        <h1 class="text-center mb-4">Registrar Movimentação</h1>

        <form id="formMovimentacao" class="card p-4 mx-auto" style="max-width:400px;">
            <div class="mb-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" class="form-select" required>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="itemId" class="form-label">ID do Item</label>
                <input type="number" id="itemId" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="quantidade" class="form-label">Quantidade</label>
                <input type="number" id="quantidade" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Registrar</button>
        </form>
    </main>

    <!-- Rodapé -->
    <footer class="footer text-center">
        © Reuse+. Todos os direitos reservados.
    </footer>
</body>

</html>
