<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Favoritos - ReuseMais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" href="assets/faveicon-reuseMais.png" type="image/x-icon">

    <style>
        :root {
            --primary: #198754;
            --dark: #212529;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, #1a1a1a 100%);
            color: #fff;
        }

        .navbar {
            background: var(--dark) !important;
        }

        .navbar-brand {
            color: var(--primary) !important;
            font-weight: bold;
        }

        .page-content {
            padding: 100px 20px 50px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .product-header {
            background: linear-gradient(135deg, var(--primary) 0%, #155d38 100%);
            padding: 15px;
            font-weight: bold;
        }

        .product-body {
            padding: 15px;
        }

        .badge-category {
            background: var(--primary);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }

        .btn-remove {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .footer {
            background: var(--dark);
            padding: 20px;
            text-align: center;
        }

        .btn-danger {
            background: #dc3545;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-recycle"></i> Reuse+</a>
            <div class="collapse navbar-collapse ms-auto">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="principal.html">Meus Produtos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <div class="container">
            <h1 class="mb-4">❤️ Meus Favoritos</h1>
            <div class="products-grid" id="favoritosContainer">
                <div class="empty-state col-12">
                    <i class="bi bi-heart" style="font-size: 48px;"></i>
                    <p>Nenhum favorito ainda</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer d-flex pb-2 justify-content-center fs-5">
        <small>© <span id="getFullYear"></span> Reuse+. Todos os direitos reservados.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function carregarFavoritos() {
            try {
                const user = JSON.parse(localStorage.getItem("user") || "{}");
                if (!user.id) { window.location.href = "login.html"; return; }

                const token = localStorage.getItem("token");
                const headers = { "Content-Type": "application/json", "Authorization": `Bearer ${token}` };

                const respFav = await fetch("http://localhost:5069/api/favoritos", { headers });
                const favoritos = await respFav.json();

                const respProdutos = await fetch("http://localhost:5069/api/produtos", { headers });
                const produtos = await respProdutos.json();

                const container = document.getElementById("favoritosContainer");
                container.innerHTML = "";

                if (favoritos.length === 0) {
                    container.innerHTML = `<div class="empty-state col-12"><i class="bi bi-heart" style="font-size: 48px;"></i><p>Nenhum favorito ainda</p></div>`;
                    return;
                }

                favoritos.forEach(fav => {
                    const produto = produtos.find(p => p.id === fav.produtoId);
                    if (produto) {
                        const card = document.createElement("div");
                        card.className = "product-card";
                        card.innerHTML = `
                            <div class="product-header">${produto.nome}</div>
                            <div class="product-body">
                                <div class="badge-category">${produto.categoria}</div>
                                <p>${produto.descricao || "Sem descrição"}</p>
                                <button class="btn btn-sm btn-success me-2" onclick="ir('produto-detalhes.html?id=${produto.id}')">Ver</button>
                                <button class="btn-remove btn-sm" onclick="removerFavorito(${produto.id})">Remover</button>
                            </div>
                        `;
                        container.appendChild(card);
                    }
                });
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        async function removerFavorito(produtoId) {
            try {
                const token = localStorage.getItem("token");
                const headers = { "Content-Type": "application/json", "Authorization": `Bearer ${token}` };
                await fetch(`http://localhost:5069/api/favoritos/${produtoId}`, { method: "DELETE", headers });
                carregarFavoritos();
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        function ir(url) { window.location.href = url; }
        window.addEventListener("load", carregarFavoritos);
    </script>
    <script src="js/app.js"></script>
    <script src="js/favoritos.js"></script>
</body>

</html>
