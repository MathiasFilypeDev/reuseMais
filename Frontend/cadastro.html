<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ReuseMais</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="assets/faveicon-reuseMais.png" type="image/x-icon">
    <script src="js/cadastro.js"></script>
</head>

<body class="bg-secondary">

    <nav class="navbar navbar-expand-lg mb-4 navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Reuse+</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="my-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-body bg-black">
                            <h2 class="text-center text-light mb-4">📝 Cadastre-se</h2>

                            <div id="msgArea"></div>

                            <form id="formCadastro">
                                <div class="mb-3">
                                    <label for="nome" class="form-label text-light">Nome:</label>
                                    <input type="text" id="nome" class="form-control" placeholder="Seu nome" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label text-light">Email:</label>
                                    <input type="email" id="email" class="form-control" placeholder="seu@email.com"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label for="senha" class="form-label text-light">Senha:</label>
                                    <input type="password" id="senha" class="form-control" placeholder="Sua senha"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label for="confirmarSenha" class="form-label text-light">Confirmar Senha:</label>
                                    <input type="password" id="confirmarSenha" class="form-control"
                                        placeholder="Confirme sua senha" required>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                            </form>

                            <p class="text-center text-secondary mt-3">
                                Já tem conta? <a href="login.html">Faça login</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer d-flex pb-2 justify-content-center fs-5 bg-black text-light">
        <small>© <span id="getFullYear"></span> Reuse+. Todos os direitos reservados.</small>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
