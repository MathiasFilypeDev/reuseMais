<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="Js/principal.js" defer></script>
</head>

<body id="bodyPrincipal" onload="verificarLogin()">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Reuse+</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><button class="btn btn-outline-light" onclick="logout()">Sair</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container page-content mt-5">
        <h1 class="text-center mb-4">Itens Disponíveis</h1>
        <table id="tabelaItens" class="table table-dark table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Quantidade</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h2 class="text-center mt-5">Minhas Movimentações</h2>
        <table id="tabelaMovimentacoes" class="table table-dark table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tipo</th>
                    <th>Item</th>
                    <th>Quantidade</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <footer class="footer text-center">
        © Reuse+. Todos os direitos reservados.
    </footer>
</body>

</html>
