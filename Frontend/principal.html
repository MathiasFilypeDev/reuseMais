<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Reuse+ - Página Principal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/principal.js" defer></script>
    <link rel="icon" href="assets/faveicon-reuseMais.png" type="image/x-icon">
</head>

<body class="bg-dark text-light" id="bodyPrincipal" onload="verificarLogin()">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-warning" href="index.html">Reuse+</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <button class="btn btn-outline-warning" onclick="logout()">Sair</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container page-content mt-5 pt-4">
        <!-- Itens Disponíveis -->
        <h1 class="text-center mb-4 text-info">Itens Disponíveis</h1>
        <div class="card bg-secondary shadow-lg mb-5">
            <div class="card-body">
                <table id="tabelaItensDisponiveis" class="table table-dark table-hover table-striped mb-0">
                    <thead class="table-light text-dark">
                        <tr>
                            <th>ID</th>
                            <th>Imagem</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Prazo</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Meus Itens -->
        <div class="d-flex justify-content-between align-items-center mt-5 mb-3">
            <h2 class="text-warning">Meus Itens</h2>
            <button class="btn btn-success btn-lg rounded-circle" id="btnAddItem">+</button>
        </div>
        <div class="card bg-secondary shadow-lg">
            <div class="card-body">
                <table id="tabelaMeusItens" class="table table-dark table-hover table-striped mb-0">
                    <thead class="table-light text-dark">
                        <tr>
                            <th>ID</th>
                            <th>Imagem</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Quantidade</th>
                            <th>Prazo</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer
        class="footer d-flex justify-content-center align-items-center fs-6 bg-black text-light mt-5 py-3 shadow-lg">
        <small>© <span id="anoAtual"></span> Reuse+. Todos os direitos reservados.</small>
    </footer>

    <!-- Modal para adicionar item -->
    <div class="modal fade" id="modalAddItem" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header border-0">
                    <h5 class="modal-title">Adicionar Novo Item</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formAddItem">
                        <div class="mb-3">
                            <label for="nomeItem" class="form-label">Nome</label>
                            <input type="text" id="nomeItem" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="descricaoItem" class="form-label">Descrição</label>
                            <textarea id="descricaoItem" class="form-control" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="quantidadeItem" class="form-label">Quantidade</label>
                            <input type="number" id="quantidadeItem" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="categoriaItem" class="form-label">Categoria</label>
                            <select id="categoriaItem" class="form-select" required>
                                <option value="Eletrônicos">Eletrônicos</option>
                                <option value="Roupas">Roupas</option>
                                <option value="Móveis">Móveis</option>
                                <option value="Livros">Livros</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="imagemItem" class="form-label">Foto do Item</label>
                            <input type="file" id="imagemItem" class="form-control" accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Salvar Item</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
